# We do our best to sync this template with the latest version in our internal documentation.
# For MIT developers, we strongly recommend copying the pyproject.toml template from:
# https://mitlibraries.atlassian.net/wiki/spaces/IN/pages/3432415247/Python+Project+Linters#Template-for-pyproject.toml

[project]
name = "dsc"
version = "2.1.7" # See https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#version
requires-python = ">=3.13"

dependencies = [
    "boto3",
    "boto3-stubs[essential, ses]",
    "click",
    "dspace-rest-client>=0.1.17",
    "jinja2",
    "jsonschema",
    "lxml",
    "pandas",
    "pynamodb",
    "requests>=2.34.0",
    "sentry-sdk",
    "smart_open",
]

[dependency-groups]
dev = [
    "coveralls",
    "freezegun",
    "ipython",
    "moto[server]",
    "mypy",
    "pandas-stubs",
    "pip-audit",
    "pre-commit",
    "pytest",
    "ruff",
    "types-jsonschema",
    "types-requests",
]

[tool.uv]
package = true
override-dependencies = ["requests>=2.34.0"]

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["dspace_rest_client.*", "lxml", "smart_open"]
ignore_missing_imports = true


[tool.pytest.ini_options]
log_level = "INFO"

[tool.ruff]
target-version = "py313"

# set max line length
line-length = 90

# enumerate all fixed violations
show-fixes = true

[tool.ruff.lint]
select = ["ALL", "PT"]
ignore = [
    # default
    "C90",
    "COM812",
    "CPY001",
    "D100",
    "D101", 
    "D102",
    "D103",
    "D104", 
    "D107",
    "EM101",
    "EM102",
    "G004",
    "ISC001", 
    "N812", 
    "PLR0912",
    "PLR0913", 
    "PLR0915",
    "PTH", 
    "S321",
    "TRY003", 
]


# allow autofix behavior for specified rules
fixable = ["E", "F", "I", "Q"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "ANN",
    "ARG001",
    "PLR0917",
    "S101",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 90

[tool.ruff.lint.pydocstyle]
convention = "google"

[project.scripts]
dsc = "dsc.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dsc"]
